plugins {
    id 'base'
    alias(libs.plugins.protobuf) apply false
}

allprojects {
    group = 'dev.kizuna.meridian.qivariants'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'

    repositories { mavenCentral() }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) }
        withSourcesJar()
    }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.java.get().toInteger()
        options.encoding = 'UTF-8'
    }
    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
        }
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
    }
}

tasks.named('assemble') { dependsOn ':shared:assemble', ':server:assemble' }
tasks.named('check') { dependsOn ':shared:check', ':server:check' }
tasks.named('clean') { dependsOn ':shared:clean', ':server:clean' }
tasks.register('test') {
    group = 'verification'
    dependsOn ':shared:test', ':server:test'
}
tasks.register('demo') {
    group = 'application'
    dependsOn ':server:demo'
}
