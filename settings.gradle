pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

// 相邻仓库位置与第三方版本都由 Framework 的工作区脚本提供（kizunaWorkspace、libs）。
apply from: new File(rootDir.parentFile, 'Kizuna-Meridian-Mod-Framework/scripts/workspace.gradle')

rootProject.name = 'kizuna-meridian-qi-variants-addon'
include 'shared', 'server'

// 复用独立框架仓库，不复制框架协议或生成类。
kizunaWorkspace.includeSource('framework', [client: 'local.meridian:client', server: 'local.meridian:server'])
